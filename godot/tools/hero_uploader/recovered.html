<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recovered models — Hero Studio</title>
<style>
  :root { --bg:#0f0e0c; --panel:#161410; --border:#2c2820; --fg:#e8e2d4; --fg-dim:#9a917f; --brass:#b08d4a; --brass-bright:#e2b866; --green-ok:#6fbf73; --vinyl:#d05c5c; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:16px; padding:12px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); }
  header h1 { font:18px Georgia, serif; margin:0; color:var(--brass-bright); }
  header a { color:var(--brass); }
  header .count { color:var(--fg-dim); margin-left:auto; }
  main { padding:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .card img { width:100%; aspect-ratio:1; object-fit:contain; background:#000; border-radius:3px; }
  .card .none { aspect-ratio:1; display:grid; place-items:center; color:var(--fg-dim); background:#000; }
  .card code { font-size:10px; color:var(--fg-dim); word-break:break-all; }
  .card select, .card input { width:100%; background:#0b0a08; color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:6px; font:12px monospace; }
  .card button { background:var(--brass); color:#1a1408; border:0; border-radius:3px; padding:7px; font:600 12px sans-serif; cursor:pointer; }
  .card button:disabled { opacity:.5; cursor:default; }
  .card .msg { font-size:11px; min-height:14px; }
  .card .msg.ok { color:var(--green-ok); } .card .msg.err { color:var(--vinyl); }
  .card.done { opacity:.45; }
  .empty { padding:40px; color:var(--fg-dim); grid-column:1/-1; }
  label.ow { font-size:11px; color:var(--fg-dim); display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>Recovered models</h1>
  <a href="./">← Hero Studio</a>
  <span class="count" id="count">…</span>
</header>
<main id="grid"><div class="empty">loading…</div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let heroes = [];
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const j = await r.json().catch(() => ({ error: 'bad response' }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function options(filter) {
  const q = (filter || '').toLowerCase();
  return heroes.filter(h => !q || (h.slug + ' ' + h.name + ' ' + (h.tag || '')).toLowerCase().includes(q))
    .map(h => `<option value="${esc(h.slug)}">${esc(h.name)}${h.installed ? ' ✓' : ''}${h.base ? ' ↳ ' + esc(h.look?.label || 'look') : ''}</option>`).join('');
}
function card(m) {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `${m.thumb ? `<img src="${m.thumb}" alt="">` : '<div class="none">no thumbnail</div>'}
    <code>${esc(m.task_id)} · ${(m.size / 1048576).toFixed(1)} MB</code>
    <input placeholder="filter characters…">
    <select size="1">${options('')}</select>
    <label class="ow"><input type="checkbox" class="owbox"> replace a model already there</label>
    <button>Assign</button>
    <div class="msg"></div>`;
  const filt = c.querySelector('input[placeholder]'), sel = c.querySelector('select'), btn = c.querySelector('button'), msg = c.querySelector('.msg');
  filt.addEventListener('input', () => { sel.innerHTML = options(filt.value); });
  btn.addEventListener('click', async () => {
    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'assigning…';
    try {
      const r = await api('POST', '/api/assign', { task_id: m.task_id, slug: sel.value, overwrite: c.querySelector('.owbox').checked });
      msg.className = 'msg ok'; msg.textContent = `→ ${r.glb}`; c.classList.add('done');
      const h = heroes.find(x => x.slug === r.slug); if (h) h.installed = true;
      $('count').textContent = `${document.querySelectorAll('.card:not(.done)').length} left to assign`;
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; btn.disabled = false; }
  });
  return c;
}
async function load() {
  try {
    const roster = await api('GET', '/api/roster');
    heroes = roster.entries.filter(e => e.kind === 'hero').map(e => ({ slug: e.slug, name: e.name, tag: e.tag, base: e.base, look: e.look, installed: !!e.status?.glb_installed }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const rec = await api('GET', '/api/recovered');
    const grid = $('grid'); grid.innerHTML = '';
    if (!rec.recovered.length) { grid.innerHTML = '<div class="empty">nothing in recovered/ — run: python3 godot/tools/meshy_recover.py fetch-all --days 7</div>'; }
    for (const m of rec.recovered) grid.appendChild(card(m));
    $('count').textContent = `${rec.recovered.length} to assign`;
  } catch (err) {
    $('grid').innerHTML = `<div class="empty">could not reach the runner: ${esc(err.message)} — start it with: python3 godot/tools/meshy_pipeline.py serve</div>`;
  }
}
load();
</script>
</body>
</html>
