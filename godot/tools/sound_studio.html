<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern Mythology — Sound Studio</title>
<style>
  :root {
    --bg: #0d121c; --panel: #161c2a; --panel2: #1f2638; --panel3: #283047;
    --border: #2d3548; --accent: #c8a268; --accent-dim: #6d5c3e;
    --text: #d8d4c8; --text-dim: #7c8398;
    --good: #7cffb0; --warn: #ffb060; --bad: #ff6464; --info: #7cb6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .dim { color: var(--text-dim); }

  header { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 8px 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font: 600 16px/1.2 ui-serif, Georgia, serif; color: var(--accent); letter-spacing: .02em; }
  .lanes { display: flex; gap: 4px; }
  .lane { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 5px 12px;
    cursor: pointer; display: flex; flex-direction: column; min-width: 128px; text-align: left; }
  .lane b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
  .lane span { font-size: 11px; color: var(--text-dim); }
  .lane.active { border-color: var(--accent); background: var(--panel2); }
  .lane.active b { color: var(--accent); }
  .lane .bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .lane .bar i { display: block; height: 100%; background: var(--good); }
  .spacer { flex: 1; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border);
    color: var(--text-dim); white-space: nowrap; }
  .chip.warn { color: var(--warn); border-color: #6b4a22; cursor: pointer; }
  .chip.bad { color: var(--bad); border-color: #6e2a2a; }
  .chip.good { color: var(--good); border-color: #2c5c44; }

  main { display: grid; grid-template-columns: 270px minmax(0, 1fr) 430px; min-height: 0; }
  .col { min-height: 0; overflow-y: auto; }
  .nav { background: var(--panel); border-right: 1px solid var(--border); padding: 10px; }
  .lib { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .lib-scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 0 10px 10px; }
  h2 { margin: 12px 0 6px; font: 600 11px/1 ui-sans-serif, sans-serif; color: var(--accent);
    text-transform: uppercase; letter-spacing: .08em; }
  h2:first-child { margin-top: 2px; }

  button { background: var(--panel3); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px;
    cursor: pointer; font-size: 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { color: var(--bg); filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button.rec.on { background: #7a1e26; border-color: var(--bad); color: #fff; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { padding: 3px 8px; font-size: 11px; background: var(--bg); color: var(--text-dim); }
  .seg button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  input[type=text], input[type=number], input[type=search], select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 7px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent-dim); }

  .navitem { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: 4px; padding: 5px 7px; margin-bottom: 2px; }
  .navitem.active { background: var(--panel2); border-color: var(--accent-dim); }
  .navitem .t { display: flex; justify-content: space-between; gap: 8px; }
  .navitem .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navitem .n { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  .navitem .bar { height: 2px; background: var(--border); margin-top: 4px; }
  .navitem .bar i { display: block; height: 100%; background: var(--good); }
  .navitem.done { opacity: .55; }

  .slots { display: flex; flex-direction: column; min-height: 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-wrap: wrap; }
  .toolbar .title { font: 600 14px ui-serif, Georgia, serif; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar label { font-size: 12px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .slotlist { overflow-y: auto; min-height: 0; flex: 1; }
  .slot { display: grid; grid-template-columns: 34px 84px minmax(0, 1fr) auto; gap: 10px; align-items: start;
    padding: 8px 12px; border-bottom: 1px solid #202739; cursor: pointer; border-left: 3px solid transparent; }
  .slot:hover { background: #121826; }
  .slot.armed { background: var(--panel2); border-left-color: var(--accent); }
  .slot .idx { color: var(--text-dim); font-size: 11px; padding-top: 2px; }
  .slot.nv { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .slot .who { font-weight: 600; color: var(--accent); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .who.narr { color: var(--text-dim); font-weight: 400; font-style: italic; }
  .slot .txt { font: 13px/1.45 ui-serif, Georgia, serif; }
  .slot .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; overflow-wrap: anywhere; }
  .slot .right { display: flex; gap: 6px; align-items: center; }
  .st { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .st.outstanding { color: var(--warn); background: rgba(255,176,96,.1); }
  .st.assigned { color: var(--good); background: rgba(124,255,176,.08); }
  .st.unwired { color: var(--info); background: rgba(124,182,255,.1); }
  .st.missing { color: var(--bad); background: rgba(255,100,100,.1); }
  .play { width: 26px; height: 24px; padding: 0; border-radius: 50%; font-size: 10px; flex: none; }
  .play.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .group-h { padding: 5px 12px; font-size: 11px; color: var(--text-dim); background: #10151f; border-bottom: 1px solid #202739;
    position: sticky; top: 0; z-index: 1; }
  .empty { padding: 36px 20px; text-align: center; color: var(--text-dim); }

  .armed-card { padding: 10px; border-bottom: 1px solid var(--border); background: var(--panel2); }
  .armed-card .hd { display: flex; gap: 8px; align-items: baseline; }
  .armed-card .hd b { color: var(--accent); }
  .armed-card .body { font: 13px/1.45 ui-serif, Georgia, serif; margin: 6px 0; max-height: 110px; overflow-y: auto; }
  .armed-card .path { font-size: 11px; color: var(--text-dim); overflow-wrap: anywhere; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
  .row input[type=text] { flex: 1; }
  .hint { font-size: 11px; color: var(--text-dim); margin-top: 5px; }
  .hint.warn { color: var(--warn); }

  .tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--border); }
  .tab { background: transparent; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0;
    padding: 5px 10px; color: var(--text-dim); }
  .tab.active { background: var(--bg); border-color: var(--border); color: var(--accent); }
  .libtools { display: flex; gap: 6px; padding: 8px 10px; align-items: center; }
  .libtools input[type=search] { flex: 1; }
  .item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center;
    padding: 6px; border: 1px solid transparent; border-radius: 5px; margin-bottom: 3px; background: var(--bg); cursor: pointer; }
  .item.sel { border-color: var(--accent-dim); }
  .item.live { border-color: #2c5c44; }
  .item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .item .meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .item .acts { display: flex; gap: 4px; align-items: center; }
  .item .acts button { padding: 3px 7px; font-size: 11px; }
  .stars { letter-spacing: 1px; cursor: pointer; color: #414a61; user-select: none; }
  .stars b { color: var(--accent); font-weight: 400; }
  .badge { font-size: 9px; letter-spacing: .08em; padding: 1px 5px; border-radius: 3px; }
  .badge.live { background: var(--good); color: var(--bg); font-weight: 700; }
  .badge.game { border: 1px solid var(--border); color: var(--text-dim); }
  .drop { border: 1px dashed var(--border); border-radius: 5px; padding: 10px; text-align: center; color: var(--text-dim);
    font-size: 12px; margin: 8px 0; }
  .dragging .drop { border-color: var(--accent); color: var(--accent); background: rgba(200,162,104,.06); }
  .job { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; margin-bottom: 4px; font-size: 12px; }
  .job .bar { height: 3px; background: var(--border); margin-top: 5px; }
  .job .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .job.error { border-color: #6e2a2a; } .job.error .msg { color: var(--bad); }
  .job.done .bar i { background: var(--good); }
  .job .detail { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 7px 14px;
    display: grid; grid-template-columns: auto 230px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; }
  footer .now { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  footer canvas { width: 100%; height: 40px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; display: block; }
  footer .time { font-size: 11px; color: var(--text-dim); min-width: 84px; text-align: right; }
  .kbd { font: 10px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--text-dim); }

  #toasts { position: fixed; right: 16px; bottom: 76px; display: flex; flex-direction: column; gap: 6px; z-index: 20; }
  .toast { background: var(--panel3); border: 1px solid var(--border); border-left: 3px solid var(--good); border-radius: 4px;
    padding: 8px 12px; max-width: 420px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .toast.err { border-left-color: var(--bad); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; width: min(760px, 92vw); padding: 14px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog textarea { width: 100%; height: 46vh; font: 12px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }
  dialog h3 { margin: 0 0 8px; color: var(--accent); font: 600 14px ui-serif, Georgia, serif; }
  dialog p { margin: 0 0 8px; color: var(--text-dim); font-size: 12px; }
  @media (max-width: 1180px) { main { grid-template-columns: 220px minmax(0, 1fr) 360px; } }
</style>
</head>
<body>
<header>
  <h1>Sound Studio</h1>
  <div class="lanes" id="lanes"></div>
  <span class="spacer"></span>
  <span id="envChips" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></span>
  <button class="ghost" id="refreshBtn" title="Rescan the project and library">Rescan</button>
  <button class="ghost" id="helpBtn">Keys</button>
</header>

<main>
  <aside class="col nav" id="nav"></aside>
  <section class="slots">
    <div class="toolbar" id="toolbar"></div>
    <div class="slotlist" id="slotlist"></div>
  </section>
  <aside class="lib" id="lib">
    <div class="armed-card" id="armed"></div>
    <div class="tabs" id="libtabs"></div>
    <div class="libtools" id="libtools"></div>
    <div class="lib-scroll" id="libscroll"></div>
  </aside>
</main>

<footer>
  <button class="play" id="tPlay" style="width:34px;height:32px;font-size:12px">▶</button>
  <div class="now" id="tNow"><span class="dim">Nothing playing</span></div>
  <canvas id="tWave" height="40"></canvas>
  <div class="time mono" id="tTime">0:00 / 0:00</div>
  <div style="display:flex;gap:6px;align-items:center">
    <button id="tA" title="Play what the game currently plays for this slot (A)">A · current</button>
    <button id="tB" title="Play the selected library item (B)">B · candidate</button>
    <input type="range" id="tVol" min="0" max="1" step="0.01" value="0.9" style="width:70px" title="Monitor volume">
  </div>
</footer>

<div id="toasts"></div>
<dialog id="dlg"><h3 id="dlgTitle"></h3><p id="dlgNote"></p><textarea id="dlgText" spellcheck="false"></textarea>
  <div class="row" style="justify-content:flex-end"><button id="dlgCopy" class="primary">Copy</button><button id="dlgClose">Close</button></div></dialog>

<script>
'use strict';
// ── tiny helpers ───────────────────────────────────────────────────────────
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
// replaceChildren() would print a literal "null" for skipped children; h() already drops them.
function fill(el, ...kids) { el.replaceChildren(...kids.flat(3).filter(k => k != null && k !== false)); }
async function api(path, body, raw) {
  const opt = body === undefined ? {} : {
    method: 'POST',
    headers: Object.assign({'X-MM-Studio': '1'}, raw ? {} : {'Content-Type': 'application/json'}),
    body: raw ? body : JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  let j;
  try { j = await r.json(); } catch (e) { j = {error: 'The studio server did not answer. Is it still running?'}; }
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, err) {
  const t = h('div', {class: 'toast' + (err ? ' err' : '')}, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), err ? 9000 : 4000);
}
const fmtDur = (s) => s == null ? '' : s < 10 ? s.toFixed(1) + 's' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const KIND_LABEL = {voice: 'Dialogue', sfx: 'SFX', music: 'Music'};
const STATUS_LABEL = {outstanding: 'outstanding', assigned: 'assigned', unwired: 'on disk · not wired', missing: 'file missing'};
function prefs() { try { return JSON.parse(localStorage.getItem('mm_sound_studio') || '{}'); } catch (e) { return {}; } }
function savePrefs() {
  try { localStorage.setItem('mm_sound_studio', JSON.stringify({lane: S.lane, vol: S.vol, navMode: S.navMode,
    scene: S.scene, char: S.char, outstanding: S.outstanding, autoAdvance: S.autoAdvance, showGame: S.showGame, bound: S.bound})); } catch (e) {}
}

// ── state ──────────────────────────────────────────────────────────────────
const P = prefs();
const S = {
  data: null, lane: P.lane || 'voice', vol: P.vol ?? 5, navMode: P.navMode || 'scene',
  scene: P.scene || '', char: P.char || '', lines: [], linesTotal: 0,
  outstanding: P.outstanding ?? true, autoAdvance: P.autoAdvance ?? true, bound: P.bound ?? false,
  q: '', armed: '', libTab: 'cand', libQ: '', showGame: P.showGame ?? false, sel: '',
  gen: {provider: '', seconds: 120, direction: '', renderer: 'builtin'},
  rev: 0, recording: null, sfxForm: false,
};

function laneSlots() {
  if (!S.data) return [];
  if (S.lane === 'voice') return S.lines;
  if (S.lane === 'sfx') return S.data.sfx;
  return S.data.music.filter(m => (S.vol === null || m.vol === S.vol) && (!S.bound || (m.chapters || []).length));
}
function visibleSlots() {
  const q = S.q.trim().toLowerCase();
  return laneSlots().filter(s => {
    if (S.outstanding && s.status === 'assigned' && s.slot !== S.armed) return false;
    if (!q) return true;
    return [s.text, s.char, s.title, s.desc, s.id, s.scene].some(v => v && String(v).toLowerCase().includes(q));
  });
}
function findSlot(id) {
  if (!S.data || !id) return null;
  return S.lines.find(s => s.slot === id) || S.data.music.find(s => s.slot === id) || S.data.sfx.find(s => s.slot === id) || null;
}
const armedSlot = () => findSlot(S.armed);
function candidates(slot) {
  if (!slot || !S.data) return [];
  return S.data.library.filter(it => it.link === slot.slot || it.live.includes(slot.slot));
}
function slotName(slot) {
  if (!slot) return '';
  return slot.kind === 'voice' ? `${slot.char === '_narrator' ? 'Narrator' : slot.char} · ${slot.scene} #${String(slot.index).padStart(3, '0')}` : (slot.title || slot.id);
}

// ── data loading ───────────────────────────────────────────────────────────
function showOffline() {
  // Opened as a file, or the server was stopped: say how to start it instead of an empty page.
  fill($('#slotlist'), h('div', {class: 'empty'},
    h('p', {style: 'font-size:14px;color:var(--text)'}, 'The Sound Studio needs its local server.'),
    h('p', {}, 'In a terminal, from the repo:'),
    h('pre', {class: 'mono', style: 'display:inline-block;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:10px 14px;user-select:all'},
      'cd godot/tools && ./run_sound_studio.sh'),
    h('p', {}, 'It opens this page at http://127.0.0.1:8787/ with the project and library loaded.')));
}
async function refresh(keepLines) {
  if (location.protocol === 'file:') return showOffline();
  try {
    S.data = await api('/api/state');
    S.rev++;
    if (!keepLines || S.lane === 'voice') await loadLines();
    renderAll();
    if (S.data.jobs.some(j => j.state === 'running')) pollJobs();
  } catch (e) { toast(e.message, true); if (!S.data) showOffline(); }
}
async function loadLines(more) {
  if (!S.data) return;
  if (S.navMode === 'scene') {
    if (!S.scene || !S.data.scenes.some(s => s.id === S.scene)) {
      const first = S.data.scenes.find(s => (S.vol === null || s.vol === S.vol) && s.done < s.total) || S.data.scenes.find(s => S.vol === null || s.vol === S.vol);
      S.scene = first ? first.id : '';
    }
    if (!S.scene) { S.lines = []; S.linesTotal = 0; return; }
    const r = await api('/api/lines?limit=1000&scene=' + encodeURIComponent(S.scene));
    S.lines = r.lines; S.linesTotal = r.total;
  } else {
    if (!S.char) { S.lines = []; S.linesTotal = 0; return; }
    const offset = more ? S.lines.length : 0;
    const r = await api(`/api/lines?limit=300&offset=${offset}&char=${encodeURIComponent(S.char)}` +
      (S.vol === null ? '' : '&vol=' + S.vol) + (S.outstanding ? '&status=outstanding' : ''));
    S.lines = more ? S.lines.concat(r.lines) : r.lines; S.linesTotal = r.total;
  }
}

// ── header ─────────────────────────────────────────────────────────────────
function renderHeader() {
  const d = S.data;
  const tot = {voice: [0, 0], sfx: [0, 0], music: [0, 0]};
  d.scenes.forEach(s => { tot.voice[0] += s.done; tot.voice[1] += s.total; });
  d.sfx.forEach(s => { tot.sfx[0] += s.status === 'assigned'; tot.sfx[1]++; });
  d.music.forEach(s => { tot.music[0] += s.status === 'assigned'; tot.music[1]++; });
  fill($('#lanes'), ...['voice', 'sfx', 'music'].map(k =>
    h('button', {class: 'lane' + (S.lane === k ? ' active' : ''), onclick: () => setLane(k)},
      h('b', {}, KIND_LABEL[k]),
      h('span', {}, `${(tot[k][1] - tot[k][0]).toLocaleString()} outstanding of ${tot[k][1].toLocaleString()}`),
      h('div', {class: 'bar'}, h('i', {style: `width:${pct(tot[k][0], tot[k][1])}%`})))));
  const chips = [];
  if (d.config_error) chips.push(h('span', {class: 'chip bad', title: d.config_error}, 'sound_providers.json error'));
  if (!d.env.ffmpeg) chips.push(h('span', {class: 'chip bad', title: 'Without ffmpeg the studio can only copy files whose format already matches the slot.'}, 'ffmpeg missing'));
  if (d.env.git_changes) chips.push(h('span', {class: 'chip warn', onclick: showCommit, title: 'Show the commit command'}, `${d.env.git_changes} uncommitted audio change${d.env.git_changes === 1 ? '' : 's'}`));
  chips.push(h('span', {class: 'chip mono', title: 'Library folder'}, d.env.library.replace(/^.*\/(?=[^/]+\/[^/]+$)/, '…/')));
  fill($('#envChips'), ...chips);
}
function showCommit() {
  const repo = S.data.env.repo;
  showText('Commit your audio work',

function arm(id, noScroll) {
  S.armed = id; S.sel = ''; S.libTab = 'cand';
  const slot = armedSlot();
  if (slot) {
    const c = candidates(slot);
    const live = c.find(x => x.live.includes(slot.slot));
    const first = c.filter(x => x.kind !== 'score' && x !== live)[0];
    S.sel = (first || live || {}).id || '';
    const ready = Object.entries(S.data.providers).filter(([, p]) => p.kinds.includes(slot.kind));
    if (!ready.some(([n]) => n === S.gen.provider)) S.gen.provider = (ready.find(([, p]) => p.ready) || ready[0] || [''])[0];

function step(dir, outstandingOnly) {
  const vis = visibleSlots();
  if (!vis.length) return;
  let i = vis.findIndex(s => s.slot === S.armed);
  for (let n = 0; n < vis.length; n++) {
    i = (i + dir + vis.length) % vis.length;
    if (i < 0) i = 0;
    if (!outstandingOnly || vis[i].status !== 'assigned') { arm(vis[i].slot); return; }
  }
}

async function startGen(slot) {

let pollTimer = null;
async function pollJobs(now) {
  if (pollTimer && !now) return;
  clearTimeout(pollTimer);
  const tick = async () => {
    let jobs;
    try { jobs = (await api('/api/jobs')).jobs; } catch (e) { pollTimer = null; return; }
    const before = (S.data.jobs || []).filter(j => j.state === 'running').map(j => j.id);
    S.data.jobs = jobs;
    const finished = jobs.filter(j => before.includes(j.id) && j.state !== 'running');
    if (finished.length) {
      await refresh(true);
      for (const j of finished) {
        if (j.state === 'error') toast(j.label + ': ' + j.message, true);
        else { toast(j.label + ' finished.'); const a = j.files.find(f => !/\.(mid|json)$/.test(f)); if (a) { S.sel = a; S.libTab = 'cand'; renderLib(); } }
      }
    } else renderArmed();
    pollTimer = jobs.some(j => j.state === 'running') ? setTimeout(tick, 1000) : null;
  };
  pollTimer = setTimeout(tick, now ? 150 : 1000);
}

  return h('div', {class: 'item' + (it.id === S.sel ? ' sel' : '') + (live ? ' live' : ''), 'data-item': it.id, onclick: () => { S.sel = it.id; renderLibList(); if (!isScore) playItem(it); }},
    isScore ? h('span', {class: 'dim', style: 'text-align:center', title: 'Score / MIDI'}, '♪') : playBtn('item:' + it.id, () => { S.sel = it.id; playItem(it); renderLibList(); }, 'Play'),
    h('div', {style: 'min-width:0'},
      h('div', {class: 'nm', title: it.id}, slot && it.link === slot.slot && slot.id && it.name.startsWith(slot.id + '__') ? it.name.slice(slot.id.length + 2) : it.name),
      h('div', {class: 'meta'},
        live ? h('span', {class: 'badge live'}, 'LIVE') : null,
        it.game ? h('span', {class: 'badge game'}, 'IN GAME') : null,
        isScore ? h('span', {}, it.ext === 'json' ? 'score' : 'midi') : h('span', {class: 'mono'}, fmtDur(it.dur)),
        h('span', {}, it.ext + ' · ' + fmtSize(it.size)),
        it.game || isScore ? null : stars(it),
        h('span', {class: 'dim', style: 'cursor:text', title: 'Click to edit the note', onclick: (e) => { e.stopPropagation(); editNote(it); }}, it.note || (it.game ? '' : '+ note')),
        S.libTab !== 'cand' ? h('span', {class: 'mono'}, it.dir) : null)),
    h('div', {class: 'acts'}, acts));
}
function renderLibList() {
  const slot = armedSlot(), items = libItems();
  const kids = [];
  if (S.libTab === 'cand' && !slot) kids.push(h('div', {class: 'empty'}, 'No slot armed.'));
  else if (!items.length) kids.push(h('div', {class: 'empty'}, S.libTab === 'cand' ?
    'No candidates yet. Record, generate, drop files here, or pick one from the other tabs.' : 'Nothing in the library matches.'));
  else items.slice(0, 400).forEach(it => kids.push(itemRow(it, slot)));
  if (items.length > 400) kids.push(h('div', {class: 'hint'}, `Showing 400 of ${items.length}. Search to narrow.`));
  kids.push(h('div', {class: 'drop'}, slot && S.libTab === 'cand' ? `Drop audio, .mid or .score.json here to add candidates for this slot` : `Drop files here to add them to the ${KIND_LABEL[S.lane].toLowerCase()} library`));
  fill($('#libscroll'), ...kids);
}
async function editNote(it) {
  if (it.game) return;
  const v = prompt('Note for ' + it.name, it.note || '');
  if (v === null) return;
  try { await api('/api/meta', {item: it.id, note: v}); it.note = v; renderLibList(); } catch (e) { toast(e.message, true); }
}
async function renderScore(it) {
  try { await api('/api/render', {item: it.id, renderer: S.gen.renderer}); pollJobs(true); } catch (e) { toast(e.message, true); }
}
async function act(path, body, okMsg) {
  try { await api(path, body); toast(okMsg); await refresh(); } catch (e) { toast(e.message, true); }
}
async function assign(it) {
  const slot = armedSlot();
  if (!slot || !it || it.kind === 'score') return;
  const here = slot.slot;
  try {
    const r = await api('/api/assign', {slot: here, item: it.id});
    toast(`Assigned → ${r.target}` + (r.converted ? ' (converted)' : '') + (r.kept.length ? ' · previous file kept in the library' : ''));
    stopAudio();
    await refresh();
    if (S.autoAdvance && S.lane === 'voice') { S.armed = here; step(1, true); }
  } catch (e) { toast(e.message, true); }
}

// ── uploads + recording ────────────────────────────────────────────────────
async function upload(files, slot) {
  let n = 0, last = '';
  for (const f of files) {
    try {
      const qs = `name=${encodeURIComponent(f.name)}&kind=${S.lane}` + (slot ? `&slot=${encodeURIComponent(slot.slot)}` : '');
      last = (await api('/api/upload?' + qs, f, true)).item; n++;
    } catch (e) { toast(e.message, true); }
  }
  if (n) { toast(`Added ${n} file${n === 1 ? '' : 's'} to the library.`); await refresh(true); if (last && !/\.(mid|json)$/.test(last)) { S.sel = last; renderLibList(); } }
}
function pickFiles(slot) {
  const inp = h('input', {type: 'file', multiple: true, accept: 'audio/*,.mid,.midi,.json'});
  inp.onchange = () => upload([...inp.files], slot);
  inp.click();
}
const libEl = $('#lib');
['dragenter', 'dragover'].forEach(ev => libEl.addEventListener(ev, e => { e.preventDefault(); libEl.classList.add('dragging'); }));
['dragleave', 'drop'].forEach(ev => libEl.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === libEl) libEl.classList.remove('dragging'); }));
libEl.addEventListener('drop', e => { const files = [...(e.dataTransfer.files || [])]; if (files.length) upload(files, S.libTab === 'cand' ? armedSlot() : null); });

function wavBlob(buf) {
  // Godot can't import webm/opus, so a mic take is stored as 16-bit mono WAV.
  const n = buf.length, ch = buf.numberOfChannels, out = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
  out.setUint16(22, 1, true); out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * 2, true);
  out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 2, true);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  for (let i = 0; i < n; i++) {
    let v = 0; for (let c = 0; c < ch; c++) v += chans[c][i];
    v = Math.max(-1, Math.min(1, v / ch)); out.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
  }
  return new Blob([out], {type: 'audio/wav'});
}
async function toggleRecord() {
  if (S.recording) { S.recording.rec.stop(); return; }
  const slot = armedSlot();
  if (!slot || slot.kind !== 'voice') return;
  try {
    stopAudio();
    const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      S.recording = null; renderArmed();
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const buf = await ctx.decodeAudioData(await new Blob(chunks, {type: rec.mimeType}).arrayBuffer());
        ctx.close();
        const d = new Date(), tag = [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join('');
        await upload([new File([wavBlob(buf)], `${String(slot.index).padStart(3, '0')}_rec_${tag}.wav`, {type: 'audio/wav'})], slot);
      } catch (e) { toast('Could not process the recording: ' + e.message, true); }
    };
    rec.start();
    S.recording = {rec};
    renderArmed();
  } catch (e) { toast('Microphone: ' + e.message, true); }
}

// ── transport ──────────────────────────────────────────────────────────────
const T = {audio: new Audio(), key: '', url: '', label: '', peaks: null, waves: new Map()};
T.audio.preload = 'auto';
function markPlaying() {
  document.querySelectorAll('[data-play]').forEach(b => {
    const on = b.dataset.play === T.key && !T.audio.paused;
    b.classList.toggle('on', on); b.textContent = on ? '❚❚' : '▶';
  });
  $('#tPlay').textContent = T.audio.paused ? '▶' : '❚❚';
}
function play(key, url, label) {
  if (T.key === key && T.url === url) { T.audio.paused ? T.audio.play() : T.audio.pause(); return; }
  T.key = key; T.url = url; T.label = label; T.peaks = null;
  T.audio.src = url; T.audio.play().catch(e => toast('Playback failed: ' + e.message, true));
  $('#tNow').textContent = label;
  drawWave(); loadWave(url);
}
function stopAudio() { T.audio.pause(); }
const playSlot = (s) => s && s.current && play('slot:' + s.slot, `/audio?game=${encodeURIComponent(s.current)}&v=${S.rev}`, 'A · ' + slotName(s));
const playItem = (it) => it && it.kind !== 'score' && play('item:' + it.id, `/audio?item=${encodeURIComponent(it.id)}&v=${it.mtime}`, 'B · ' + it.name);
['play', 'pause', 'ended'].forEach(ev => T.audio.addEventListener(ev, markPlaying));
T.audio.addEventListener('timeupdate', () => { drawWave();
  $('#tTime').textContent = `${fmtClock(T.audio.currentTime)} / ${fmtClock(T.audio.duration)}`; });
T.audio.addEventListener('error', () => { if (T.url) toast('This file would not play in the browser (it may still be fine in Godot).', true); });
const fmtClock = (s) => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
async function loadWave(url) {
  if (T.waves.has(url)) { T.peaks = T.waves.get(url); drawWave(); return; }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
    ctx.close();
    const N = 600, d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / N)), peaks = new Float32Array(N);
    for (let i = 0; i < N; i++) { let m = 0; for (let j = i * step, e = Math.min(d.length, j + step); j < e; j += 8) { const v = Math.abs(d[j]); if (v > m) m = v; } peaks[i] = m; }
    T.waves.set(url, peaks);
    if (T.waves.size > 24) T.waves.delete(T.waves.keys().next().value);
    if (T.url === url) { T.peaks = peaks; drawWave(); }
  } catch (e) { /* the waveform is a nicety; playback already reports real failures */ }
}
function drawWave() {
  const c = $('#tWave'), w = c.clientWidth, hgt = 40;
  if (c.width !== w) c.width = w;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, hgt);
  const prog = T.audio.duration ? T.audio.currentTime / T.audio.duration : 0;
  if (T.peaks) {
    const top = Math.max(0.05, ...T.peaks);
    for (let x = 0; x < w; x++) {
      const p = T.peaks[Math.floor(x / w * T.peaks.length)] / top, bar = Math.max(1, p * (hgt - 6));
      g.fillStyle = x / w < prog ? '#c8a268' : '#3a445c';
      g.fillRect(x, (hgt - bar) / 2, 1, bar);
    }
  } else { g.fillStyle = '#2d3548'; g.fillRect(0, hgt / 2, w, 1); g.fillStyle = '#c8a268'; g.fillRect(0, hgt / 2, w * prog, 1); }
}
$('#tWave').addEventListener('click', e => { if (T.audio.duration) T.audio.currentTime = e.offsetX / e.target.clientWidth * T.audio.duration; });
$('#tPlay').onclick = () => { if (T.url) T.audio.paused ? T.audio.play() : T.audio.pause(); };
$('#tVol').oninput = e => { T.audio.volume = +e.target.value; };
T.audio.volume = 0.9;
$('#tA').onclick = () => { const s = armedSlot(); if (s && s.current) playSlot(s); else toast('This slot has no file yet.', true); };
$('#tB').onclick = () => { const it = S.data.library.find(x => x.id === S.sel); if (it) playItem(it); };
window.addEventListener('resize', drawWave);

// ── keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!S.data || e.metaKey || e.ctrlKey || e.altKey || $('#dlg').open) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const items = libItems().filter(it => it.kind !== 'score');
  const selIdx = items.findIndex(it => it.id === S.sel);
  const k = e.key;
  if (k === 'ArrowDown' || k === 'j') step(1);
  else if (k === 'ArrowUp' || k === 'k') step(-1);
  else if (k === 'n' || k === 'N') step(1, true);
  else if (k === 'ArrowRight' || k === 'ArrowLeft') {
    if (!items.length) return;
    const it = items[(selIdx + (k === 'ArrowRight' ? 1 : -1) + items.length) % items.length];
    S.sel = it.id; renderLibList(); T.key = ''; playItem(it);
  }
  else if (k === ' ') { if (T.url) T.audio.paused ? T.audio.play() : T.audio.pause(); }
  else if (k === 'a' || k === 'A') $('#tA').click();
  else if (k === 'b' || k === 'B') $('#tB').click();
  else if (k === 'Enter') { if (selIdx >= 0) assign(items[selIdx]); }
  else if (k === 'r' || k === 'R') toggleRecord();
  else if (k === 'o' || k === 'O') { S.outstanding = !S.outstanding; savePrefs(); (S.lane === 'voice' && S.navMode === 'char' ? loadLines() : Promise.resolve()).then(renderAll); }
  else if (/^[1-5]$/.test(k) && selIdx >= 0 && !items[selIdx].game) rate(items[selIdx], +k);
  else return;
  e.preventDefault();
});

function renderAll() {
  if (!S.data) return;
  if (S.armed && !findSlot(S.armed)) S.armed = '';
  renderHeader(); renderNav(); renderToolbar(); renderSlots(); renderLib();
}
refresh();
</script>
</body>
</html>
