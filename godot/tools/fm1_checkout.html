<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FM-1 CHECK-OUT · Modern Mythology</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  FM-1 CHECK-OUT — a guided hardware verification for the M-VAVE FM-1 on the Steam Deck.
  Walks the user through every FM-1 feature the tools were built for but never verified on the
  device (notes, CC, DX7 voice push, clock follow, USB audio return + latency), records
  pass / fail / skipped per check and keeps the results in this browser:
    localStorage.mm_fm1_checkout    the whole record (JSON, shape below in freshResults())
    localStorage.mm_fm1_latency_ms  measured MIDI-out → USB-audio-in round trip, median ms (plain number)
  Steps adapt to the identified firmware through fm1_firmwares.js (parts / channels, DX7, clock).
  Read-only towards the synth except for what each step says it sends; never sends the updater
  protocol (only the one vendor identity query MidiInput already uses).
-->
<style>
  :root {
    --bg-0: #050304; --bg-1: #0e0908; --ink: #1a1410;
    --rule: #553318; --gold: #d8a060; --gold-hi: #ffd896;
    --text: #c8a878; --text-dim: #7a5828;
    --emerald: #4ea060; --emerald-hi: #a8e89c; --rust: #c87633; --burgundy: #7a1e26;
    --red: #c64a3a; --amber: #f0b94a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: var(--bg-0); color: var(--text); font-family: "Courier New", monospace; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: 0.18em; color: var(--gold-hi); }
  header .sub { color: var(--text-dim); font-size: 11px; font-style: italic; flex: 1; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; letter-spacing: 0.08em; padding: 3px 8px; border: 1px solid var(--rule); color: var(--text-dim); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .badge.ok { color: var(--emerald-hi); border-color: var(--emerald); }
  .badge.warn { color: var(--amber); border-color: var(--amber); }
  .badge.bad { color: var(--red); border-color: var(--red); }

  main { display: grid; grid-template-columns: 228px 1fr 290px; overflow: hidden; min-height: 0; }
  nav { border-right: 1px solid var(--rule); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  aside { border-left: 1px solid var(--rule); padding: 10px 12px; overflow: hidden; display: grid; grid-template-rows: auto auto auto 1fr; min-height: 0; }
  #card { overflow-y: auto; padding: 14px 22px 30px; min-height: 0; }

  button {
    background: var(--ink); color: var(--gold-hi); border: 1px solid var(--gold);
    padding: 6px 14px; min-height: 40px; font-family: inherit; font-size: 12px; letter-spacing: 0.08em; cursor: pointer;
    touch-action: manipulation;
  }
  button:hover:not(:disabled) { background: var(--gold); color: var(--ink); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.dim { color: var(--text-dim); border-color: var(--rule); }
  button.dim:hover:not(:disabled) { color: var(--gold-hi); border-color: var(--gold); background: var(--ink); }
  button.hot { background: var(--burgundy); }
  button.big { min-height: 52px; font-size: 14px; padding: 8px 20px; }
  a.btn { display: inline-flex; align-items: center; background: var(--ink); color: var(--gold-hi); border: 1px solid var(--gold); min-height: 52px; padding: 8px 20px; font-size: 14px; letter-spacing: 0.08em; text-decoration: none; }
  a.btn:hover { background: var(--gold); color: var(--ink); }
  button.chip { min-height: 44px; }
  button.chip.sel, button.on { background: var(--rust); color: var(--ink); border-color: var(--gold-hi); }
  button.small { min-height: 36px; font-size: 11px; padding: 4px 10px; }

  .nav-step { display: grid; grid-template-columns: 26px 18px 1fr; align-items: center; gap: 4px; text-align: left; min-height: 50px; padding: 6px 8px; border-color: var(--rule); color: var(--text); }
  .nav-step .ico { font-size: 18px; text-align: center; }
  .nav-step .n { color: var(--text-dim); }
  .nav-step i { grid-column: 3; font-style: normal; font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; }
  .nav-step.cur { border-color: var(--gold-hi); background: #241a10; }
  .nav-step:hover:not(:disabled) { background: #241a10; color: var(--gold-hi); }
  .s-pass { color: var(--emerald-hi); } .s-fail { color: var(--red); } .s-partial { color: var(--amber); }
  .s-skip, .s-na, .s-todo, .s-pending { color: var(--text-dim); } .s-info { color: var(--gold); }

  .step-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .step-head .stepno { color: var(--text-dim); font-size: 11px; letter-spacing: 0.14em; }
  .step-head h2 { margin: 0; color: var(--gold-hi); font-size: 18px; letter-spacing: 0.14em; }
  .step-head .st { margin-left: auto; font-size: 12px; letter-spacing: 0.12em; }
  h3 { color: var(--gold); font-size: 12px; letter-spacing: 0.16em; margin: 18px 0 8px; border-bottom: 1px solid #2a1c12; padding-bottom: 4px; font-weight: normal; }
  aside h2 { margin: 0 0 6px; color: var(--gold); font-size: 11px; letter-spacing: 0.16em; border-bottom: 1px solid var(--rule); padding-bottom: 4px; font-weight: normal; }

  .do { background: var(--bg-1); border: 1px solid var(--rule); border-left: 3px solid var(--gold); padding: 10px 14px; font-size: 14px; line-height: 1.55; color: var(--gold-hi); margin: 8px 0 12px; }
  .do ol, .do ul { margin: 4px 0; padding-left: 22px; }
  .do b { color: #fff0cc; }
  .note { color: var(--text-dim); font-size: 12px; line-height: 1.5; margin: 6px 0; }
  .note b { color: var(--text); }
  .warnbox { border: 1px solid var(--amber); color: var(--amber); padding: 8px 12px; font-size: 13px; line-height: 1.5; margin: 8px 0; }
  .na { border: 1px dashed var(--rule); padding: 14px; color: var(--text); font-size: 14px; line-height: 1.6; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .msg { color: var(--emerald-hi); font-size: 13px; min-height: 18px; margin: 6px 0; }
  .msg.bad { color: var(--red); }

  .chk { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; border: 1px solid #2a1c12; background: var(--bg-1); padding: 8px 10px; margin: 6px 0; }
  .chk .ico { font-size: 22px; text-align: center; }
  .chk .lbl { font-size: 14px; color: var(--text); line-height: 1.4; }
  .chk .lbl .opt { font-size: 10px; color: var(--text-dim); font-style: normal; letter-spacing: 0.08em; border: 1px solid #2a1c12; padding: 0 4px; margin-left: 4px; }
  .chk .val { font-size: 12px; color: var(--text-dim); margin-top: 3px; line-height: 1.4; word-break: break-word; }
  .chk.st-pass { border-color: var(--emerald); } .chk.st-pass .ico { color: var(--emerald-hi); }
  .chk.st-fail { border-color: var(--red); } .chk.st-fail .ico { color: var(--red); }
  .chk.st-skip .ico, .chk.st-pending .ico { color: var(--text-dim); }
  .yn { display: flex; gap: 6px; }
  .yn button { min-width: 92px; min-height: 52px; font-size: 15px; }
  .yn button.yes { color: var(--emerald-hi); border-color: var(--emerald); }
  .yn button.no { color: #ff9a8a; border-color: var(--red); }
  .yn button.skip { min-width: 64px; font-size: 12px; color: var(--text-dim); border-color: var(--rule); }
  .yn button.yes.chosen { background: var(--emerald); color: var(--ink); }
  .yn button.no.chosen { background: var(--red); color: #fff; }
  .yn button.skip.chosen { background: var(--rule); color: var(--gold-hi); }

  .part { display: grid; grid-template-columns: 230px 1fr; gap: 10px; align-items: center; }
  .part > button { min-height: 52px; }
  .bignote { display: flex; gap: 24px; align-items: baseline; margin: 10px 0; }
  .bignote .p { font-size: 46px; color: var(--gold-hi); letter-spacing: 0.08em; min-width: 140px; }
  .bignote .m { color: var(--text); font-size: 14px; }
  .bar { height: 14px; background: var(--ink); border: 1px solid #2a1c12; position: relative; flex: 1; min-width: 120px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rust); width: 0; }
  .ccrow { display: grid; grid-template-columns: 70px 1fr 100px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
  .meter { height: 22px; background: var(--ink); border: 1px solid var(--rule); position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--emerald) 0%, var(--emerald) 70%, var(--amber) 88%, var(--red) 100%); }
  .meter b { position: absolute; right: 6px; top: 2px; font-size: 12px; color: var(--gold-hi); font-weight: normal; }
  .lamp { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--rule); background: var(--ink); display: inline-block; vertical-align: middle; }
  .lamp.lit { background: var(--gold-hi); box-shadow: 0 0 18px var(--gold); }
  .lamp.down.lit { background: var(--rust); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .ack { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--amber); margin: 8px 0; cursor: pointer; min-height: 44px; }
  .ack input { width: 28px; height: 28px; accent-color: var(--rust); }
  details { margin: 10px 0; border: 1px solid #2a1c12; padding: 6px 10px; }
  details summary { cursor: pointer; color: var(--gold); font-size: 13px; letter-spacing: 0.08em; min-height: 32px; line-height: 32px; }
  details li { font-size: 13px; line-height: 1.6; margin: 3px 0; }
  code, pre { font-family: inherit; background: var(--ink); color: var(--gold-hi); border: 1px solid #2a1c12; }
  code { padding: 0 4px; }
  pre { padding: 8px 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  .navbtns { display: flex; justify-content: space-between; margin-top: 22px; border-top: 1px solid #2a1c12; padding-top: 12px; }
  table.sum { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.sum td, table.sum th { border-bottom: 1px solid #2a1c12; padding: 5px 6px; text-align: left; vertical-align: top; }
  table.sum th { color: var(--gold); font-weight: normal; letter-spacing: 0.08em; font-size: 11px; }
  table.sum tr.stephdr td { color: var(--gold-hi); background: var(--bg-1); letter-spacing: 0.08em; }
  table.sum td.v { color: var(--text-dim); font-size: 12px; }
  .lat { font-size: 30px; color: var(--gold-hi); letter-spacing: 0.06em; }
  #fwbox { font-size: 12px; line-height: 1.55; margin-bottom: 10px; color: var(--text); }
  #fwbox b { color: var(--gold-hi); font-weight: normal; }
  #fwbox .w { color: var(--amber); }
  .mon { font-size: 10px; line-height: 1.45; overflow-y: auto; background: var(--bg-1); border: 1px solid var(--rule); padding: 6px 8px; white-space: pre-wrap; min-height: 0; }
  .mon .t { color: var(--text-dim); } .mon .in { color: var(--emerald-hi); } .mon .out { color: var(--amber); }
  footer { padding: 6px 16px; border-top: 1px solid var(--rule); color: var(--text-dim); font-size: 11px; font-style: italic; display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>
  <header>
    <h1>FM-1 CHECK-OUT</h1>
    <span class="badge bad" id="b-midi">MIDI: not connected</span>
    <span class="badge" id="b-sysex">SYSEX: —</span>
    <span class="badge" id="b-fw">FW: —</span>
    <span class="badge" id="b-audio">AUDIO IN: —</span>
    <span class="sub">plug in · follow the steps · answer ✔ / ✘ · results stay in this browser</span>
    <button class="dim small" id="new-run" title="Clear every answer and start again">NEW CHECK-OUT</button>
  </header>

  <main>
    <nav id="nav"></nav>
    <section id="card"></section>
    <aside>
      <h2>FIRMWARE</h2>
      <div id="fwbox">not connected yet.</div>
      <h2>MIDI MONITOR</h2>
      <div class="mon" id="mon"></div>
    </aside>
  </main>

  <footer>
    <span>← <a href="index.html">all tools</a></span>
    <span><a href="fm1_console.html">FM-1 console</a> · <a href="fm1_firmware_atlas.html">firmware atlas</a> · <a href="daw.html">DAW</a></span>
    <span>results: localStorage <b>mm_fm1_checkout</b> · latency: <b>mm_fm1_latency_ms</b></span>
  </footer>

<script src="fm1_firmwares.js"></script>
<script src="midi_input.js"></script>
<script src="fm1_dx7.js"></script>
<script src="dx7_synth.js"></script>
<script src="audio_kit.js"></script>
<script src="touch_controls.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowIso = () => new Date().toISOString();
const fmtDate = iso => { const d = new Date(iso), z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); };
const hex = d => [...d].map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
const LS_RESULTS = 'mm_fm1_checkout', LS_LATENCY = 'mm_fm1_latency_ms';

// Own MidiInput: identification is run by step 1 so every reply is recorded.
const mi = new MidiInput({ autoIdentify: false });
const TOOL_IN_CH = mi.channel;     // the other tools' IN filter (prefs) — reported, not changed
const TOOL_OUT_CH = mi.outChannel; // a fixed OUT channel overrides auto routing in the tools
mi.channel = 0;                    // listen omni here (never saved)

const STEPS = [
  { id: 'connect',   title: 'CONNECT & IDENTIFY' },
  { id: 'notes_out', title: 'NOTES OUT' },
  { id: 'notes_in',  title: 'NOTES IN' },
  { id: 'cc',        title: 'KNOBS & CC' },
  { id: 'dx7',       title: 'DX7 VOICE PUSH' },
  { id: 'clock',     title: 'CLOCK FOLLOW' },
  { id: 'audio',     title: 'USB AUDIO & LATENCY' },
  { id: 'summary',   title: 'SUMMARY' },
];

// ═══ results record ═══════════════════════════════════════════════
// {v, tool, started, updated, cur,
//  device: {inName, outName, sysex, firmware, firmwareName, fwSource, vendor, info, parts:[{role,ch}],
//           dx7, clock, toolInChannel, toolOutChannel, audioIn},
//  steps: {<stepId>: {mode, checks: {<checkId>: {label, kind:'auto'|'ask', optional, status, value, at}}}},
//  latency: {ms, jitterMs, minMs, maxMs, samples:[ms|null], found, of, sampleRate, input, part, at} | null}
function freshResults() {
  return { v: 1, tool: 'fm1_checkout', started: nowIso(), updated: nowIso(), cur: 'connect', device: {}, steps: {}, latency: null };
}
function loadResults() {
  try { const r = JSON.parse(localStorage.getItem(LS_RESULTS) || 'null'); if (r && r.v === 1 && r.steps && r.device) return r; } catch (e) { /* blocked / corrupt */ }
  return null;
}
let R = loadResults();
const RESUMED = !!(R && Object.keys(R.steps).length);
if (!R) R = freshResults();
function save() {
  R.updated = nowIso();
  try { localStorage.setItem(LS_RESULTS, JSON.stringify(R)); } catch (e) { /* storage blocked: results still on screen */ }
}

// ═══ firmware context (everything from fm1_firmwares.js) ══════════
// Per-firmware clock set-up wording. The FACTS (does it follow clock) come from the registry's
// `clock` field; this only words the menu path where we know it.
const CLOCK_HOWTO = {
  felucca: 'Press <b>HOME</b> twice to reach the <b>CLOCK</b> page, then turn <b>knob 3</b> until it reads <b>CLK = USB</b>. (It is saved with the project.)',
  sloop: 'Open <b>GLO › SYSTEM › SYNC</b> and set it to <b>USB</b>.',
  sloop_alg: 'Open <b>GLO › SYSTEM › SYNC</b> and set it to <b>USB</b> (same menu as SLOOP).',
};
function fwc() {
  const id = R.device.firmware || '';
  const fw = id ? fm1Firmware(id) : null;
  const family = id === 'felucca-family';
  const label = R.device.firmwareName || (fw ? fw.name : family ? 'Felucca family (unknown fork)' : 'unknown firmware');
  const roles = fw && fw.roles ? fw.roles : null;
  const dx7 = fw ? fw.dx7 : family ? false : 'unknown';
  const clockRaw = fw ? fw.clock : null;
  let clock = 'unknown';
  if (fw) {
    if (clockRaw == null) clock = 'no';
    else if (/unknown/i.test(clockRaw)) clock = 'unknown';
    else if (/\bin\b|follow/i.test(clockRaw)) clock = 'yes';
  }
  return { id, fw, family, label, roles, dx7, clock, clockRaw };
}
const ROLE_ORDER = ['bass', 'chords', 'lead', 'drums'];
function parts(c = fwc()) {
  if (!c.roles) return [{ role: 'lead', ch: 1, single: true }];
  return ROLE_ORDER.filter(r => c.roles[r]).map(r => ({ role: r, ch: c.roles[r] }));
}
function leadCh(c = fwc()) { return (c.roles && c.roles.lead) || 1; }

// ═══ checks ═══════════════════════════════════════════════════════
function stepRec(sid) { return R.steps[sid] || (R.steps[sid] = { checks: {} }); }
let keepIds = null;   // ids rendered by the current card (stale ones are pruned)
function ensure(sid, cid, label, o = {}) {
  const st = stepRec(sid);
  let c = st.checks[cid];
  if (!c) c = st.checks[cid] = { label, kind: o.kind || 'ask', optional: !!o.optional, status: 'pending', value: '' };
  else { c.label = label; c.kind = o.kind || 'ask'; c.optional = !!o.optional; }
  if (keepIds) keepIds.add(cid);
  return c;
}
function setCheck(sid, cid, status, value, label) {
  const st = stepRec(sid);
  const c = st.checks[cid] || (st.checks[cid] = { label: label || cid, kind: 'auto', optional: false, status: 'pending', value: '' });
  if (label) c.label = label;
  c.status = status;
  if (value !== undefined) c.value = value;
  c.at = nowIso();
  save(); refreshChecks(); refreshNav();
}
function derive() {
  // CC out: passes when any swept controller changed the sound.
  const cc = R.steps.cc;
  if (cc && cc.checks.cc_out) {
    const rows = Object.entries(cc.checks).filter(([k]) => /^cc_out_\d+$/.test(k)).map(([, v]) => v);
    const o = cc.checks.cc_out;
    const passed = Object.entries(cc.checks).filter(([k, v]) => /^cc_out_\d+$/.test(k) && v.status === 'pass').map(([k]) => 'CC ' + k.slice(7));
    if (passed.length) { o.status = 'pass'; o.value = passed.join(', ') + ' changed the sound'; }
    else if (rows.length && rows.every(r => r.status !== 'pending')) {
      o.status = rows.some(r => r.status === 'fail') ? 'fail' : 'skip';
      o.value = o.status === 'fail' ? 'no swept controller changed the sound' : 'not tried';
    } else { o.status = 'pending'; o.value = ''; }
  }
}
function naReason(sid) {
  const c = fwc();
  if (sid === 'dx7' && c.dx7 === false) return c.label + ' has no DX7 engine (registry: dx7 false), so a DX7 voice dump has nothing to land in. Its sounds are edited in its own editor.';
  if (sid === 'clock' && c.clock === 'no') return c.label + ' has no MIDI clock input.';
  return '';
}
function stepStatus(sid) {
  if (sid === 'summary') return 'info';
  if (naReason(sid)) return 'na';
  const st = R.steps[sid];
  if (!st) return 'todo';
  const cs = Object.values(st.checks);
  if (!cs.length) return 'todo';
  const req = cs.filter(c => !c.optional);
  const anyPass = cs.some(c => c.status === 'pass'), anyFail = cs.some(c => c.status === 'fail');
  if (req.some(c => c.status === 'fail')) return 'fail';
  if (req.some(c => c.status === 'pending')) return anyPass || anyFail ? 'partial' : 'todo';
  if (cs.every(c => c.status === 'skip' || c.status === 'pending')) return 'skip';
  return 'pass';
}
const ICON = { pass: '✔', fail: '✘', skip: '–', na: '–', partial: '◐', todo: '○', pending: '○', info: '≡' };
const WORD = { pass: 'PASS', fail: 'FAIL', skip: 'SKIPPED', na: 'N/A FOR THIS FIRMWARE', partial: 'IN PROGRESS', todo: 'NOT RUN', pending: 'WAITING', info: '' };

function row(sid, cid, label, o = {}) {
  ensure(sid, cid, label, o);
  const auto = o.kind === 'auto';
  const btns = o.btns || (auto ? [] : ['yes', 'no', 'skip']);
  const BT = { yes: o.yes || '✔ YES', no: o.no || '✘ NO', skip: 'SKIP' };
  return `<div class="chk ${auto ? 'auto' : 'ask'}" data-sid="${sid}" data-cid="${cid}">
    <span class="ico"></span>
    <div class="q"><div class="lbl">${esc(label)}${auto ? '<i class="opt">AUTOMATIC</i>' : ''}${o.optional ? '<i class="opt">OPTIONAL</i>' : ''}</div><div class="val"></div></div>
    ${btns.length ? `<div class="yn">${btns.map(b => `<button class="${b}" data-ans="${b}">${BT[b]}</button>`).join('')}</div>` : '<span></span>'}
  </div>`;
}
function refreshChecks() {
  derive();
  document.querySelectorAll('#card .chk').forEach(el => {
    const st = R.steps[el.dataset.sid];
    const c = st && st.checks[el.dataset.cid];
    if (!c) return;
    el.className = 'chk ' + (c.kind === 'auto' ? 'auto' : 'ask') + ' st-' + c.status;
    el.querySelector('.ico').textContent = ICON[c.status] || '○';
    el.querySelector('.val').textContent = c.value || (c.kind === 'auto' && c.status === 'pending' ? 'waiting…' : '');
    el.querySelectorAll('.yn button').forEach(b => b.classList.toggle('chosen',

// ═══ STEP 6 · clock follow ════════════════════════════════════════
const CLK = { running: false, bpm: 90, anchorPerf: 0, anchorTick: 0, next: 0, timer: 0, sent: 0, raf: 0 };
function clkPer() { return 60000 / (CLK.bpm * 24); }
function clkPump() {

  for (;;) {

}

    CLK.anchorTick = CLK.next;
  }

}

    const ticks = CLK.anchorTick + (performance.now() - CLK.anchorPerf) / clkPer();
    const beat = Math.floor(ticks / 24), ph = ticks / 24 - beat;
    lamp.classList.toggle('lit', ticks >= 0 && ph < 0.18);
    lamp.classList.toggle('down', beat % 4 === 0);

  };

}

  const b = $('new-run');
  if (!clearArmed) { clearArmed = setTimeout(() => { clearArmed = 0; b.textContent = 'NEW CHECK-OUT'; }, 3000); b.textContent = 'TAP AGAIN TO CLEAR'; return; }
  clearTimeout(clearArmed); clearArmed = 0; b.textContent = 'NEW CHECK-OUT';
  clkStop(true); stopAll();
  R = freshResults(); save();
  NI.count = 0; NI.chans.clear(); NI.on.clear(); NI.vmin = 127; NI.vmax = 0; NI.lo = 127; NI.hi = 0; CCIN.clear();
  log('t', 'new check-out started');
  render();
});
window.addEventListener('midiinput-status', () => { refreshHeader(); });
window.addEventListener('midiinput-disconnected', () => { log('t', 'FM-1 disconnected'); clkStop(true); });
window.addEventListener('beforeunload', () => { clkStop(true); stopAll(); });
log('t', 'FM-1 check-out. Web MIDI: ' + (mi.supported ? 'available' : 'NOT available — use Chrome'));
R.cur = 'connect';   // a reload needs the MIDI connection again: always start at step 1 (answers are kept)
// Permission already granted (a reload mid-check-out): reconnect straight away.
try { if (navigator.permissions && mi.supported) navigator.permissions.query({ name: 'midi', sysex: true }).then(s => { if (s.state === 'granted' && !mi.access) ACT.connect(); }).catch(() => {}); } catch (e) { /* no permissions API */ }
render();
</script>
</body>
</html>
